<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Volumes — Seven Tools for Making | Akhil Sreekumar</title>
    <link rel="stylesheet" href="src/shaders/threeui.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #171a24;
            color: #f4eee6;
        }
        .shader-frame {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
        }
        .portfolio-nav-bar {
            position: fixed;
            top: 14px;
            left: 20px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }
        .portfolio-back-btn {
            background: rgba(23, 26, 36, 0.85);
            border: 1px solid rgba(244, 238, 230, 0.25);
            color: #f4eee6;
            padding: 8px 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            text-decoration: none;
            backdrop-filter: blur(12px);
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        .portfolio-back-btn:hover {
            background: #c87046;
            border-color: #c87046;
            color: #ffffff;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <!-- Top return bar -->
    <div class="portfolio-nav-bar">
        <a href="index.html" class="portfolio-back-btn">
            ← Akhil Sreekumar Portfolio
        </a>
    </div>

    <!-- CompleteShelfLandingPage Shader Frame -->
    <div class="shader-frame">
        <div class="threeui-background landing-page-frame" style="position: relative; overflow: hidden; background: #080808; width: 100%; height: 100%;">
            <iframe
                id="shelf-frame"
                title="Working Volumes — Seven Tools for Making"
                src="public/landing-pages/complete-shelf-v2.html"
                loading="eager"
                style="position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #171a24;"
            ></iframe>
        </div>
    </div>

    <script>
        // Apply configured typography & accents to the embedded canonical shelf
        const frame = document.getElementById('shelf-frame');
        const applyCustomization = () => {
            try {
                const doc = frame.contentDocument || frame.contentWindow.document;
                if (!doc) return;
                
                let style = doc.getElementById('threeui-configured-typography');
                if (!style) {
                    style = doc.createElement('style');
                    style.id = 'threeui-configured-typography';
                    doc.head.appendChild(style);
                }
                style.textContent = `
                    :root {
                        --serif: "Iowan Old Style", "Baskerville", "Times New Roman", serif !important;
                        --mono: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif !important;
                        --accent: #c87046 !important;
                    }
                `;
            } catch (e) {
                console.warn('Frame styling initialized via sandbox defaults');
            }
        };

        frame.addEventListener('load', applyCustomization);
        // Also apply if already loaded
        if (frame.contentDocument && frame.contentDocument.readyState === 'complete') {
            applyCustomization();
        }
    </script>
</body>
</html>
